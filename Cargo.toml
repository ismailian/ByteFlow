[workspace]
resolver = "3"
members = ["crates/bf-core", "crates/bf-data", "crates/bf-app", "crates/byteflow", "crates/bf-cli"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bf-core = { path = "crates/bf-core" }
bf-data = { path = "crates/bf-data" }
bf-app = { path = "crates/bf-app" }

aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel", "zeroize"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.3"
rand = "0.9"
rayon = "1.12"
base64 = "0.22"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
quick-xml = "0.39"
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
walkdir = "2.5"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"

# ---- Fast, small builds (see ~/.claude/CLAUDE.md) ----
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Crypto must be usable in dev builds: Argon2id 64 MiB at opt-level 0 takes many seconds.
opt-level = 2

[profile.dev.build-override]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "abort"
