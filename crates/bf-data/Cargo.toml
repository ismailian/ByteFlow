[package]
name = "bf-data"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
bf-core.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
bytes.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
quick-xml.workspace = true
rusqlite.workspace = true
chrono.workspace = true
dirs.workspace = true
walkdir.workspace = true
md5 = { package = "md-5", version = "0.10" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
